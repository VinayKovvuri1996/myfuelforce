<div class="min-h-screen flex items-center justify-center relative">
  <div class="absolute inset-0 bg-black opacity-50"></div>
  <div
    class="relative z-10 bg-white/90 backdrop-blur-sm p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-ioc-orange">
    <div class="text-center mb-8">
      <img src="/assets/fuel-force-logo.jpg" alt="FuelForce Logo"
        class="h-24 w-auto mx-auto mb-4 rounded-lg shadow-lg border-2 border-orange-500">
      <h1 class="text-4xl font-extrabold text-ioc-blue tracking-tight uppercase">FuelForce</h1>
      <p class="text-gray-600 mt-2 font-medium">Dealer Portal</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
          Username
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </span>
          <input
            class="pl-10 shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-ioc-orange focus:border-transparent transition duration-200"
            id="username" type="text" formControlName="username" placeholder="Enter your username">
        </div>
      </div>

      <div class="mb-8">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
          Password
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
              </path>
            </svg>
          </span>
          <input
            class="pl-10 shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-ioc-orange focus:border-transparent transition duration-200"
            id="password" type="password" formControlName="password" placeholder="••••••••">
        </div>
      </div>

      <div *ngIf="error" class="mb-6 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 text-sm rounded">
        {{ error }}
      </div>

      <div class="flex items-center justify-between">
        <button
          class="bg-ioc-orange hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline w-full transition duration-300 transform hover:-translate-y-1 shadow-lg"
          type="submit">
          Sign In
        </button>
      </div>
      <div class="mt-4 text-center">
        <a routerLink="/register" class="text-ioc-blue hover:text-blue-800 font-medium">New Dealer? Register Here</a>
      </div>
    </form>
    <div class="mt-6 text-center text-xs text-gray-500">
      &copy; 2025 Indian Oil Corporation Ltd. All rights reserved.
    </div>
  </div>
</div>
