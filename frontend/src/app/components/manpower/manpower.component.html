<div class="min-h-screen bg-gray-50">
    <nav class="bg-ioc-blue shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <img src="/assets/fuel-force-logo.jpg" alt="FuelForce Logo"
                            class="h-10 w-auto rounded-md mr-2 border-2 border-white shadow-sm">
                        <h1 class="text-2xl font-bold text-white tracking-wider brand-text">FuelForce</h1>
                    </div>
                    <div class="hidden sm:ml-10 sm:flex sm:space-x-4">
                        <a routerLink="/dashboard" routerLinkActive="bg-blue-800 text-white"
                            class="text-gray-300 hover:bg-blue-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
                        <a routerLink="/customers" routerLinkActive="bg-blue-800 text-white"
                            class="text-gray-300 hover:bg-blue-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Customers</a>
                        <a routerLink="/sales" routerLinkActive="bg-blue-800 text-white"
                            class="text-gray-300 hover:bg-blue-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Sales</a>
                        <a routerLink="/stock" routerLinkActive="bg-blue-800 text-white"
                            class="text-gray-300 hover:bg-blue-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Stock</a>
                        <a routerLink="/manpower" routerLinkActive="bg-blue-800 text-white"
                            class="text-gray-300 hover:bg-blue-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Manpower</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-4 border-l-4 border-ioc-orange pl-4">Manpower / Shifts</h2>
        <div *ngIf="error" class="mb-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 rounded">{{ error }}</div>
        <div *ngIf="success" class="mb-4 p-3 bg-green-100 border-l-4 border-green-500 text-green-700 rounded">{{ success }}</div>

        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-t-4 border-ioc-blue">
            <h3 class="text-lg font-bold text-gray-900 mb-6">Start New Shift</h3>
            <form [formGroup]="shiftForm" (ngSubmit)="startShift()">
                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="user_id">Employee name</label>
                        <input type="text" formControlName="user_id" placeholder="e.g. Ramesh / Staff-01"
                            class="shadow-sm border border-gray-300 rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-ioc-blue">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="start_time">Start Time</label>
                        <input type="datetime-local" formControlName="start_time"
                            class="shadow-sm border border-gray-300 rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-ioc-blue">
                    </div>
                </div>
                <div class="mt-6">
                    <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" type="submit"
                        [disabled]="saving">
                        Start Shift
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white shadow-lg overflow-hidden sm:rounded-xl border-l-4 border-ioc-orange">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Employee</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Start</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">End</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Action</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr *ngFor="let shift of shifts">
                        <td class="px-6 py-4 text-sm font-bold text-gray-900">{{ shift.user_id }}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">{{ shift.start_time | date:'short' }}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">{{ shift.end_time ? (shift.end_time | date:'short') : 'Active' }}</td>
                        <td class="px-6 py-4 text-sm">
                            <button *ngIf="!shift.end_time" (click)="endShift(shift.id)"
                                class="text-red-600 hover:text-red-900 font-bold">End Shift</button>
                            <span *ngIf="shift.end_time" class="text-gray-400">Completed</span>
                        </td>
                    </tr>
                    <tr *ngIf="!shifts.length">
                        <td colspan="4" class="px-6 py-6 text-center text-gray-500">No shifts yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
